version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salessync-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: SalesSync
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sales_dashboard
      DB_USERNAME: salessync_app
      DB_PASSWORD: StrongProductionPassword2026!
      RUN_MIGRATIONS: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - salessync_network

  db:
    image: mysql:8.0
    container_name: salessync-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootDatabaseMasterPassword2026!
      MYSQL_DATABASE: sales_dashboard
      MYSQL_USER: salessync_app
      MYSQL_PASSWORD: StrongProductionPassword2026!
    # Security: Database port is NOT bound to the host, preventing external access
    volumes:
      - salessync_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "salessync_app", "-pStrongProductionPassword2026!"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - salessync_network

volumes:
  salessync_db_data:
    driver: local

networks:
  salessync_network:
    driver: bridge
