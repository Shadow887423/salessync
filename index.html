<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SalesSync — Sign In</title>

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Login CSS -->
    <link rel="stylesheet" href="public/css/login.css">
</head>
<body>
    <!-- Animated Gradient Background -->
    <div class="login-bg">
        <div class="login-bg__shape login-bg__shape--1"></div>
        <div class="login-bg__shape login-bg__shape--2"></div>
        <div class="login-bg__shape login-bg__shape--3"></div>
    </div>

    <!-- Main Wrapper -->
    <div class="login-wrapper">
        <div class="login-card">

            <!-- Card Header / Brand -->
            <div class="login-card__header">
                <img src="public/images/logo.png" alt="SalesSync Logo" class="login-card__logo">
                <h1 class="login-card__brand">SalesSync</h1>
                <p class="login-card__tagline">Real-Time Sales &amp; Revenue Analytics</p>
            </div>

            <!-- Card Body -->
            <div class="login-card__body">

                <div style="margin-bottom: 1.25rem; text-align: center;">
                    <h2 id="cardTitle" style="font-size: 1.25rem; font-weight: 700; color: #1E293B; margin-bottom: 0.25rem;">SalesSync Portal</h2>
                    <p id="cardSubtitle" style="font-size: 0.85rem; color: #64748B;">Sign in to access your real-time analytics</p>
                </div>

                <!-- Alert Message -->
                <div id="loginAlert" class="login-alert">
                    <i id="alertIcon" class="fas fa-exclamation-circle"></i>
                    <span id="alertMessage"></span>
                </div>

                <!-- ==================== SIGN IN SECTION ==================== -->
                <div id="loginSection">
                    <form id="loginForm" novalidate>
                        <!-- Username -->
                        <div class="login-form-group">
                            <label for="loginUsername" class="login-label">Username</label>
                            <div class="login-input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" id="loginUsername" class="login-input" placeholder="Enter your username" autocomplete="username" required>
                            </div>
                            <span class="login-field-error" id="loginUsernameError"></span>
                        </div>

                        <!-- Password -->
                        <div class="login-form-group">
                            <label for="loginPassword" class="login-label">Password</label>
                            <div class="login-input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="loginPassword" class="login-input" placeholder="Enter your password" autocomplete="current-password" required>
                                <button type="button" class="toggle-password" data-target="loginPassword" title="Show/Hide password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="login-field-error" id="loginPasswordError"></span>
                        </div>

                        <!-- Remember Me & Forgot Password -->
                        <div class="login-options">
                            <label class="login-checkbox">
                                <input type="checkbox" id="rememberMe">
                                <span>Remember me</span>
                            </label>
                            <a href="#" class="login-forgot" onclick="alert('For this live demo, use the credentials provided in the box below: admin / admin123'); return false;">Forgot password?</a>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="loginSubmitBtn" class="login-btn login-btn--primary">
                            <i class="fas fa-sign-in-alt"></i>
                            <span>Sign In</span>
                        </button>
                    </form>

                    <!-- Clickable Demo Credentials Helper -->
                    <div class="demo-credentials" id="demoCredentialsBox">
                        <div class="demo-credentials__title">
                            <i class="fas fa-key"></i> Quick Demo Access (Click to Autofill)
                        </div>
                        <div>Username: <code>admin</code> &bull; Password: <code>admin123</code></div>
                    </div>
                </div>

                <!-- ==================== REGISTRATION SECTION ==================== -->
                <div id="registerSection" style="display: none;">
                    <form id="registerForm" novalidate>
                        <!-- Full Name -->
                        <div class="login-form-group">
                            <label for="regFullName" class="login-label">Full Name</label>
                            <div class="login-input-wrapper">
                                <i class="fas fa-id-card input-icon"></i>
                                <input type="text" id="regFullName" class="login-input" placeholder="Jane Doe" required>
                            </div>
                            <span class="login-field-error" id="regFullNameError"></span>
                        </div>

                        <!-- Username -->
                        <div class="login-form-group">
                            <label for="regUsername" class="login-label">Username</label>
                            <div class="login-input-wrapper">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" id="regUsername" class="login-input" placeholder="Choose a username" autocomplete="username" required>
                            </div>
                            <span class="login-field-error" id="regUsernameError"></span>
                        </div>

                        <!-- Password -->
                        <div class="login-form-group">
                            <label for="regPassword" class="login-label">Password (min 6 chars)</label>
                            <div class="login-input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" id="regPassword" class="login-input" placeholder="Create a password" autocomplete="new-password" required>
                                <button type="button" class="toggle-password" data-target="regPassword" title="Show/Hide password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="login-field-error" id="regPasswordError"></span>
                        </div>

                        <!-- Confirm Password -->
                        <div class="login-form-group">
                            <label for="regConfirmPassword" class="login-label">Confirm Password</label>
                            <div class="login-input-wrapper">
                                <i class="fas fa-check-double input-icon"></i>
                                <input type="password" id="regConfirmPassword" class="login-input" placeholder="Re-enter password" autocomplete="new-password" required>
                                <button type="button" class="toggle-password" data-target="regConfirmPassword" title="Show/Hide password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="login-field-error" id="regConfirmPasswordError"></span>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="regSubmitBtn" class="login-btn login-btn--primary">
                            <i class="fas fa-user-plus"></i>
                            <span>Create Account</span>
                        </button>
                    </form>
                </div>

            </div>

            <!-- Card Footer -->
            <div class="login-card__footer">
                <p id="footerLoginText">
                    Don't have an account? <a href="#" id="viewRegisterBtn">Sign up now</a>
                </p>
                <p id="footerRegisterText" style="display: none;">
                    Already have an account? <a href="#" id="viewLoginBtn">Sign in</a>
                </p>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="public/js/auth.js"></script>
    <script src="public/js/login.js"></script>
    <script>
        // Synchronize footer toggle text
        const regBtn = document.getElementById('viewRegisterBtn');
        const logBtn = document.getElementById('viewLoginBtn');
        const footerLogText = document.getElementById('footerLoginText');
        const footerRegText = document.getElementById('footerRegisterText');

        if (regBtn) {
            regBtn.addEventListener('click', () => {
                footerLogText.style.display = 'none';
                footerRegText.style.display = 'block';
            });
        }
        if (logBtn) {
            logBtn.addEventListener('click', () => {
                footerRegText.style.display = 'none';
                footerLogText.style.display = 'block';
            });
        }
    </script>
</body>
</html>
